apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: prod
  name: prod
---
apiVersion: v1
data:
  index.html: |
    <h1>Hello from PROD</h1>
kind: ConfigMap
metadata:
  labels:
    environment: prod
  name: prod-web-content-6c58dtf565
  namespace: prod
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: webapp
    environment: prod
  name: prod-webapp
  namespace: prod
spec:
  ports:
    - nodePort: 30082
      port: 80
      targetPort: 80
  selector:
    app: webapp
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: webapp
    environment: prod
  name: prod-webapp
  namespace: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
        environment: prod
    spec:
      containers:
        - image: nginx:1.27
          name: nginx
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - mountPath: /usr/share/nginx/html
              name: web-content
      volumes:
        - configMap:
            name: prod-web-content-6c58dtf565
          name: web-content
