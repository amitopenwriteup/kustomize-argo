apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: dev
  name: dev
---
apiVersion: v1
data:
  index.html: |
    <h1>Hello from DEV</h1>
kind: ConfigMap
metadata:
  labels:
    environment: dev
  name: dev-web-content-4dk5c77d98
  namespace: dev
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: webapp
    environment: dev
  name: dev-webapp
  namespace: dev
spec:
  ports:
    - nodePort: 30081
      port: 80
      targetPort: 80
  selector:
    app: webapp
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: webapp
    environment: dev
  name: dev-webapp
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
        environment: dev
    spec:
      containers:
        - image: nginx:1.25
          name: nginx
          ports:
            - containerPort: 80
          volumeMounts:
            - mountPath: /usr/share/nginx/html
              name: web-content
      volumes:
        - configMap:
            name: dev-web-content-4dk5c77d98
          name: web-content
